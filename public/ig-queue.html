<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG Queue — Ngopi Di Mana</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1D9E75; --green-light: #E1F5EEF; --green-dark: #0F6E56;
      --amber: #BA7517; --amber-light: #FAEEDA;
      --red: #A32D2D; --red-light: #FCEBEB;
      --bg: #F7F6F2; --surface: #fff; --border: #E5E3DC;
      --text: #1A1A18; --muted: #6B6B67;
      --radius: 12px; --radius-sm: 8px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    header p { font-size: 0.875rem; color: var(--muted); margin-top: 4px; }
    .tab-row { display: flex; gap: 4px; margin-bottom: 1.5rem; }
    .tab { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); font-size: 13px; color: var(--muted); cursor: pointer; }
    .tab.active { background: var(--text); border-color: var(--text); color: #fff; }
    .queue { display: flex; flex-direction: column; gap: 1rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .card-inner { display: grid; grid-template-columns: 140px 1fr; gap: 0; }
    @media (max-width: 600px) { .card-inner { grid-template-columns: 1fr; } }
    .card-img { width: 140px; height: 140px; object-fit: cover; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
    .card-img img { width: 140px; height: 140px; object-fit: cover; }
    .card-body { padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-name { font-size: 14px; font-weight: 600; }
    .card-city { font-size: 12px; color: var(--muted); }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
    .status-pending { background: var(--amber-light); color: var(--amber); }
    .status-posted { background: #E1F5EE; color: var(--green-dark); }
    .status-skipped { background: var(--red-light); color: var(--red); }
    .caption-text { font-size: 12px; line-height: 1.75; color: var(--text); white-space: pre-wrap; background: var(--bg); padding: 8px 10px; border-radius: var(--radius-sm); max-height: 100px; overflow-y: auto; }
    .hashtags-text { font-size: 11px; color: var(--green-dark); line-height: 1.8; }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .btn { padding: 5px 12px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; border: 1px solid; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.8; }
    .btn-copy { background: var(--surface); border-color: var(--border); color: var(--text); }
    .btn-posted { background: #E1F5EE; border-color: var(--green); color: var(--green-dark); }
    .btn-skip { background: var(--red-light); border-color: var(--red); color: var(--red); }
    .btn-regen { background: var(--amber-light); border-color: var(--amber); color: var(--amber); }
    .btn.done { opacity: 0.5; cursor: default; }
    .card-date { font-size: 11px; color: var(--muted); margin-left: auto; }
    .empty { text-align: center; padding: 3rem; color: var(--muted); font-size: 14px; }
    .loading { text-align: center; padding: 3rem; color: var(--muted); }
    .trigger-btn { padding: 8px 18px; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; }
    .trigger-btn:hover { opacity: 0.88; }
    .trigger-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--text); color: #fff; padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>📋 IG Caption Queue</h1>
      <p>Review caption yang sudah di-generate, copy yang bagus, post ke Instagram</p>
    </div>
    <button class="trigger-btn" id="triggerBtn">+ Generate sekarang</button>
  </header>

  <div class="tab-row">
    <button class="tab active" data-s="pending">Pending</button>
    <button class="tab" data-s="posted">Posted</button>
    <button class="tab" data-s="skipped">Skipped</button>
    <button class="tab" data-s="all">Semua</button>
  </div>

  <div class="queue" id="queue">
    <div class="loading">Memuat queue...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://iblcxviqmqiutjzxnblx.supabase.co'
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlibGN4dmlxbXFpdXRqenhuYmx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ4ODUyMDQsImV4cCI6MjA2MDQ2MTIwNH0.CFQupP7zz_6Skc330_URoP9G_TFqV5B_zibwQ9m-JZg'

  let currentStatus = 'pending'

  const sbHeaders = {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    Prefer: 'return=representation'
  }

  function showToast(msg) {
    const t = document.getElementById('toast')
    t.textContent = msg; t.classList.add('show')
    setTimeout(() => t.classList.remove('show'), 2000)
  }

  async function loadQueue() {
    const q = document.getElementById('queue')
    q.innerHTML = '<div class="loading">Memuat...</div>'

    let url = `${SUPABASE_URL}/rest/v1/ig_queue?select=*&order=created_at.desc`
    if (currentStatus !== 'all') url += `&status=eq.${currentStatus}`

    const res = await fetch(url, { headers: sbHeaders })
    const items = await res.json()

    if (!items.length) { q.innerHTML = '<div class="empty">Tidak ada item.</div>'; return }

    q.innerHTML = items.map(item => {
      const date = new Date(item.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      return `<div class="card" id="card-${item.id}">
        <div class="card-inner">
          <div class="card-img">
            ${item.image_url
              ? `<img src="${item.image_url}" onerror="this.parentElement.textContent='☕'" loading="lazy">`
              : '☕'}
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span class="card-name">${item.cafe_name}</span>
              <span class="card-city">${item.city || ''}</span>
              <span class="status-badge status-${item.status}">${item.status}</span>
              <span class="card-date">${date}</span>
            </div>
            <div class="caption-text">${item.caption || ''}</div>
            ${item.hashtags ? `<div class="hashtags-text">${item.hashtags}</div>` : ''}
            <div class="card-actions">
              <button class="btn btn-copy" onclick="copyItem('${item.id}', '${escJs(item.caption)}', '${escJs(item.hashtags)}')">Copy semua</button>
              <button class="btn btn-copy" onclick="copyText('${escJs(item.caption)}')">Copy caption</button>
              ${item.status === 'pending' ? `
                <button class="btn btn-posted" onclick="updateStatus('${item.id}', 'posted')">✓ Sudah dipost</button>
                <button class="btn btn-skip" onclick="updateStatus('${item.id}', 'skipped')">Skip</button>
                <button class="btn btn-regen" onclick="regen('${item.id}', ${item.cafe_id})">↺ Regen</button>
              ` : ''}
            </div>
          </div>
        </div>
      </div>`
    }).join('')
  }

  function escJs(str) {
    return (str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n')
  }

  function copyText(text) {
    navigator.clipboard.writeText(text.replace(/\\n/g, '\n'))
    showToast('Caption tersalin!')
  }

  function copyItem(id, caption, hashtags) {
    const full = caption.replace(/\\n/g, '\n') + '\n\n' + hashtags
    navigator.clipboard.writeText(full)
    showToast('Caption + hashtag tersalin!')
  }

  async function updateStatus(id, status) {
    const body = { status }
    if (status === 'posted') body.posted_at = new Date().toISOString()

    await fetch(`${SUPABASE_URL}/rest/v1/ig_queue?id=eq.${id}`, {
      method: 'PATCH',
      headers: sbHeaders,
      body: JSON.stringify(body)
    })
    showToast(status === 'posted' ? '✓ Marked as posted!' : 'Skipped.')
    loadQueue()
  }

  async function regen(queueId, cafeId) {
    showToast('Regenerating...')
    // Delete old entry
    await fetch(`${SUPABASE_URL}/rest/v1/ig_queue?id=eq.${queueId}`, {
      method: 'DELETE', headers: sbHeaders
    })
    // Trigger manual generate for this cafe via server task endpoint
    await fetch('/api/generate-caption-for-cafe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cafe_id: cafeId })
    })
    setTimeout(loadQueue, 1500)
  }

  async function triggerGenerate() {
    const btn = document.getElementById('triggerBtn')
    let secret = localStorage.getItem('cron_secret')
    if (!secret) {
      secret = prompt('Masukkan CRON_SECRET:')
      if (!secret) return
      localStorage.setItem('cron_secret', secret)
    }
    btn.disabled = true; btn.textContent = 'Generating...'
    try {
      const res = await fetch('/api/ig-generate', {
        method: 'POST',
        headers: { 'x-cron-secret': secret }
      })
      if (res.ok) { showToast('✓ Caption baru di-generate!'); setTimeout(loadQueue, 1500) }
      else {
        if (res.status === 401) localStorage.removeItem('cron_secret')
        showToast('Error: ' + res.statusText)
      }
    } catch(e) {
      showToast('Error: ' + e.message)
    }
    btn.disabled = false; btn.textContent = '+ Generate sekarang'
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
      tab.classList.add('active')
      currentStatus = tab.dataset.s
      loadQueue()
    })
  })

  document.getElementById('triggerBtn').addEventListener('click', triggerGenerate)

  loadQueue()
</script>
</body>
</html>
